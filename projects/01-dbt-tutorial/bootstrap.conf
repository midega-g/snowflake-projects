# Per-project provisioning config (KEY=VALUE). Every key is also passed to templates as a lowercase
# variable, e.g. <% my_key %>. Add your own keys for custom steps.
CONNECTION=dbt_tut              # snow connection base name; bootstrap uses <CONNECTION>_boot
PROJECT_KEY=DBT_TUT             # prefix for role names
PROJECT_NAME=dbt-tutorial
PROJECT_ENV=dev
PROJECT_OWNER=midega-g
COST_CENTER=learning
MY_USER=YOUR_USER

# --- phase 1: independent, parameterised account-level objects ---
RM_NAME=DBT_TUT_RM
RM_QUOTA=5
RM_FREQUENCY=MONTHLY
WH_NAME=DBT_TUT_WH
WH_SIZE=XSMALL
WH_AUTO_SUSPEND=60
# steps run in this order. Remove a step to skip it (e.g. drop resource_monitor).
PHASE1_STEPS=roles resource_monitor warehouse

# --- phase 2: project-dependent objects (need phase 1) ---
DB_NAME=DBT_TUT_DEV
DB_TRANSIENT=N
DB_RETENTION_DAYS=1
OWNER_ROLE=ADMIN                # suffix from roles.csv; owns db + warehouse
DEFAULT_ROLE=TRANSFORMER        # suffix; becomes MY_USER's default
DEFAULT_SCHEMA=STAGING
TAG_SCHEMA=GOVERNANCE
# optional steps: add e.g. sample_data (bootstrap/optional/)
PHASE2_STEPS=database schemas grants tags user_defaults
