# Install once per clone: pre-commit install
# Run on everything: pre-commit run --all-files
# Update pins: pre-commit autoupdate (stay on stable betterleaks releases)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.10.1
    hooks:
      - id: betterleaks-system   # needs the betterleaks binary on PATH, see docs/runbooks/01-first-time-setup.md
